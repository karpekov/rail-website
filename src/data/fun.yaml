# List of fun activities that RAIL Lab members participate in.
#
# Fields:
# - title:         REQUIRED - title of the activity
# - description:   REQUIRED - description of the activity
# - image:         REQUIRED - image of the activity
# - frequency:     REQUIRED - frequency of the activity

activities:
  - title: Bridge Up
    description: "Bridge Up is an eight-week program, co-organized by RAIL Lab, where young women learn coding, robotics, and machine learning. Our students tutor and mentor participants through hands-on group projects with convolutional neural networks."
    image: /images/fun/bridgeup.jpg
    frequency: Annual in Spring

  - title: Atlanta Science Festival
    description: As a part of the Atlanta Science Festival, we introduce kids to robotics. We showcase our robots, organize interactive demos and talk about our research.
    image: /images/fun/atl-science-festival.jpg
    frequency: Annual in Spring

  - title: Robo-Halloween
    description: Annual Halloween event where we dress up our robots in spooky costumes and program them to interact with kids and give out candy. Traditionally, RAIL Lab members all dress up and go around a local neighborhood in Atlanta to give out candy.
    image: /images/fun/robo-halloween.jpg
    frequency: Every October

  - title: Hiking
    description: When the weather is good, we go hiking around Atlanta.
    image: /images/fun/hiking.jpg
    frequency: Every couple of months, weather permitting